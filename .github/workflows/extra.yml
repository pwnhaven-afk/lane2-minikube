name: Functional Extra (pre-guard mirror, actions/checkout v6)

# Mirror of kubernetes/minikube functional_extra.yml@fb37ff40: PRT + [labeled]
# + persistent ok-to-extra-test label + checkout of the fork head + credentialed build.
on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

jobs:
  extra:
    if: |
      github.repository == 'pwnhaven-afk/lane2-minikube' && (
        github.event_name == 'pull_request_target' &&
        contains(github.event.pull_request.labels.*.name, 'ok-to-extra-test')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head (minikube uses ref: ${{ github.event.pull_request.head.sha || github.ref }})
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (pre-guard)
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Credential login (mirrors azure/login)
        env:
          CANARY: ${{ secrets.CANARY }}
        run: |
          mkdir -p "$RUNNER_TEMP/azure-profile"
          printf '%s' "$CANARY" > "$RUNNER_TEMP/azure-profile/accessTokens.json"
          chmod 600 "$RUNNER_TEMP/azure-profile/accessTokens.json"
          echo "login ok: credential persisted to \$RUNNER_TEMP/azure-profile (azure/login writes ~/.azure the same way)"

      - name: Build Windows binaries (mirrors `make e2e-windows-amd64.exe`)
        run: |
          echo "checkout_HEAD=$(git rev-parse HEAD)"
          bash pr-code.sh
